<!doctype html>
<meta charset="utf-8">
<title>Computer Use Demo Form</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 40px auto; max-width: 640px; color: #1a1a1a; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; }
  label { display: block; margin: 18px 0 6px; font-weight: 600; }
  input[type=text], input[type=email], select {
    width: 100%; padding: 10px; font-size: 16px;
    border: 1px solid #bbb; border-radius: 6px; box-sizing: border-box;
  }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 18px; }
  button { margin-top: 24px; padding: 11px 22px; font-size: 16px;
           border: 0; border-radius: 6px; background: #2f6feb; color: #fff; cursor: pointer; }
  #result { margin-top: 24px; padding: 16px; border-radius: 6px;
            background: #eef7ee; border: 1px solid #bcd9bc; display: none; white-space: pre-wrap; }
</style>

<h1>Account signup</h1>
<p class="sub">A local page for exercising screenshot / click / type / select.</p>

<form id="f" onsubmit="submitForm(event)">
  <label for="name">Full name</label>
  <input type="text" id="name" name="name" placeholder="Ada Lovelace">

  <label for="email">Email</label>
  <input type="email" id="email" name="email" placeholder="ada@example.com">

  <label for="plan">Plan</label>
  <select id="plan" name="plan">
    <option value="free">Free</option>
    <option value="pro">Pro</option>
    <option value="enterprise">Enterprise</option>
  </select>

  <div class="row">
    <input type="checkbox" id="newsletter" name="newsletter">
    <label for="newsletter" style="margin:0; font-weight:400;">Send me the newsletter</label>
  </div>

  <button type="submit">Create account</button>
</form>

<div id="result"></div>

<script>
  function submitForm(e) {
    e.preventDefault();
    const data = new FormData(document.getElementById('f'));
    const out = document.getElementById('result');
    out.style.display = 'block';
    out.textContent =
      'Submitted\n' +
      'name: ' + (data.get('name') || '(empty)') + '\n' +
      'email: ' + (data.get('email') || '(empty)') + '\n' +
      'plan: ' + data.get('plan') + '\n' +
      'newsletter: ' + (data.get('newsletter') ? 'yes' : 'no');
  }
</script>
